name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          yes | "$MANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew || ls -la

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Summarize unit tests
        run: |
          total=0; failures=0; errors=0; skipped=0
          for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            [ -e "$f" ] || continue
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            er=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            sk=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total + ${t:-0})); failures=$((failures + ${fl:-0}))
            errors=$((errors + ${er:-0})); skipped=$((skipped + ${sk:-0}))
          done
          echo "unit tests: $total, failures: $failures, errors: $errors, skipped: $skipped"
          if [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ]; then exit 1; fi

      - name: Compile instrumentation tests
        run: ./gradlew assembleAndroidTest --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: draftlens-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Inspect debug APK manifest
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt2"
          "$AAPT" dump permissions "$APK" > /tmp/draftlens-permissions.txt
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/draftlens-manifest.txt
          grep -E "android.permission.FOREGROUND_SERVICE(_MEDIA_PROJECTION)?" /tmp/draftlens-permissions.txt
          grep -E "android:foregroundServiceType.*0x00000020" /tmp/draftlens-manifest.txt
          grep "CaptureSessionService" /tmp/draftlens-manifest.txt
